# The three-level severity scale shared by the kb reviewers. critical= extends
# the Critical bullet with the reviewer's own always-Critical examples;
# warning= completes the Warning bullet.
[chunks.kb-severity-calibration]
text = '''
## Severity Calibration

- **Critical**: violates a load-bearing property — must be addressed before the artifact is fit for purpose. @@critical@@
- **Warning**: meaningful risk or cost — @@warning@@
- **Note**: minor concern — improvable but not load-bearing.

When uncertain between Critical and Warning, prefer Critical. Under-classifying a real issue is worse than over-classifying a marginal one.
'''

