# Canonical shared text for the coder / platform-expert agent definitions.
#
# This file is the ONE place the shared engineering-ethos text lives. The
# per-agent templates (coders/<name>.md.tmpl) reference these chunks by marker;
# gen-agents.py renders the templates and writes ../<name>.md.
#
# Marker syntax, usable in templates AND inside chunk bodies:
#
#   @@name@@                        expand chunk "name"
#   @@name variant="platform"@@     expand the named variant of a chunk
#   @@name key="value"@@            expand chunk "name" with @@key@@ bound
#   @@name wrap="70"@@              greedy-wrap the expansion to 70 columns
#
# "variant" and "wrap" are reserved keys. Every other key binds a placeholder
# referenced inside the chunk body; [chunks.X.defaults] supplies the value when
# the marker does not.
#
# Editing any chunk here changes every generated definition that uses it.
# After editing, run: python3 coders/gen-agents.py --generate

# ─── Core ethos ──────────────────────────────────────────────────────────────

# Split lead/full so shell-dsl-coder, which continues the sentence with an em
# dash instead of ending it, still shares the opening clause.
[chunks.key-guideline-lead]
text = '''**KEY GUIDELINE**: Code is cost, capability is value'''

[chunks.key-guideline]
text = '''@@key-guideline-lead@@. Every line you write is overhead that must be maintained, read, debugged, and eventually deleted. Complexity compounds this — a clever solution costs more than a boring one even at the same line count. Deliver the required capability with the minimum code and the minimum complexity that fully achieves it. When uncertain whether to add something, default to omission. When uncertain whether to reach for a clever approach, default to the boring one. Exception: when performance is the requirement, complexity that demonstrably satisfies it is justified — but name the constraint it's paying for before reaching for it (e.g., "O(N²) is unacceptable at this scale; this reduces to O(log N)").'''

[chunks.dissent]
text = '''If you believe a directive would produce technically incorrect output, state the concern and your recommended alternative before proceeding — do not silently comply.'''

[chunks.memory-note]
text = '''`memory: user` in the frontmatter is a harness-level directive; the path below is for project-local notes this agent writes'''

# ─── Testing ─────────────────────────────────────────────────────────────────

# "boundaries" is the language-idiomatic list of boundary kinds; rust-coder
# overrides it with FFI/socket/channel nouns for the same rule.
[chunks.boundary-checks-lead]
defaults.boundaries = '''external API calls, user input parsing, database writes, IPC, and queue boundaries'''
text = '''*Runtime boundary checks*: at significant system boundaries — @@boundaries@@ (any point where data crosses a trust, I/O, or thread boundary) — implement lightweight contract and expectation checks. Apply these only when the change directly touches or creates such a boundary; a fix internal to a module does not require new boundary checks.'''

[chunks.mocking-threshold]
variants.general = '''If you need to mock five dependencies to test one function, fix the design first. (Five is the threshold for general-purpose code; platform expert agents apply a stricter limit of two, as native platform APIs have non-mockable runtime behavior.)'''
variants.platform = '''Avoid mocking more than two dependencies per test; fix the design if you need more. (Two is the threshold for platform code — native platform APIs have non-mockable runtime behavior. General-purpose coder agents use five.)'''
variants.platform-long = '''If mocking more than two dependencies is required to test one function, fix the design first. (Two is the threshold for platform code — native platform APIs have non-mockable runtime behavior; a design requiring many mocks is usually poorly factored for platform constraints. General-purpose coder agents use five.)'''

[chunks.integration-artifact]
text = '''**Integration tests exercise the delivered artifact** through its public surface (the binary/API as shipped), never in-process calls to internals — those are unit/component tests, whatever the file is named. Never create dev-only entry points or test-only verbs to make testing easier; test the real surface, and if the real surface is untestable, that is a design defect to surface, not scaffold around. Dev-only switches (e.g. expensive validation such as heap checking under custom allocators) are a last resort and live behind a config-file setting, never an environment variable. Where the project defines an evidence location, preserve integration logs/artifacts there.'''

# ─── House rules ─────────────────────────────────────────────────────────────

[chunks.data-formats-scope]
text = '''project-owned configuration and structured data files'''

[chunks.commercial-approval-clause]
text = '''unless explicitly approved by the coordinator/user'''

[chunks.dependencies-lead]
variants.packages = '''**Dependencies**: every dependency is a permanent maintenance obligation — justify it before adding. No paid or commercial packages @@commercial-approval-clause@@ — report as a Blocker if a task requires a commercial dependency.'''
variants.crates = '''**Dependencies**: every crate is a permanent maintenance obligation and a compile-time and supply-chain cost — justify it before adding, and prefer one that pulls few transitive dependencies. No paid or commercial crates @@commercial-approval-clause@@ — report as a Blocker if a task requires one.'''

# Demonstrative deliberately omitted: rust-coder embeds this mid-sentence as
# "that thin abstraction...", everyone else opens with "This thin abstraction...".
[chunks.logging-abstraction-note]
text = '''thin abstraction is an explicit exception to the no-premature-abstraction principle.'''

# ─── Parallel execution ──────────────────────────────────────────────────────

[chunks.pe-preamble]
text = '''You may be dispatched as one of several agents working on the same codebase simultaneously.'''

[chunks.pe-read-bullet]
text = '''- **Read before touching**: read every file you will edit before making any changes.'''

[chunks.pe-declare-bullet]
text = '''- **Declare scope**: state which files you will modify before starting. Do not touch files outside this set without explicit instruction.'''

[chunks.pe-stop-bullet]
text = '''- **Stop on conflict**: if mid-task you discover you need to modify a file another agent may be editing, stop and report rather than proceeding.'''

[chunks.pe-expansion-bullet]
text = '''- **Scope expansion**: if you discover the task is significantly larger than described — requires touching additional systems, reveals a fundamental design gap, or would affect other agents' work — stop immediately and report to the coordinator. Do not make unilateral expansion decisions.'''

# The platform variant admits platform-required adjacent files into scope
# without pre-declaration; "adjacent" names them per platform.
[chunks.parallel-execution]
variants.general = '''
@@pe-preamble@@

@@pe-read-bullet@@
@@pe-declare-bullet@@
@@pe-stop-bullet@@
@@pe-expansion-bullet@@
- **No scope creep**
'''
variants.platform = '''
@@pe-preamble@@

@@pe-read-bullet@@
@@pe-declare-bullet@@ Platform-required adjacent files (@@adjacent@@) directly necessitated by the change are in scope without pre-declaration.
@@pe-stop-bullet@@
- **No scope creep**: complete the assigned task and stop. Don't improve adjacent code, add comments to unchanged files, or expand the task boundary.
@@pe-expansion-bullet@@
'''

# ─── Report formats ──────────────────────────────────────────────────────────

[chunks.stopping-early]
text = '''
When stopping early (file conflict or scope expansion), use this format:
- **Discovered**: what was found — the conflict, the expansion, the design gap
- **Completed**: work finished before stopping, with files touched and a one-line summary of each change
- **Not started**: what was not yet attempted
- **Recommendation**: your assessment of how to proceed
'''

[chunks.done-format]
text = '''
When done:
- **Changed**: list files modified and a one-line summary of each change
- **Not changed**: briefly note anything you explicitly chose not to touch and why, if non-obvious
- **Blockers**: any issues that prevent completing the task or that require human/coordinator decision
'''
