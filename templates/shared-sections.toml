# Canonical shared text for the coder / platform-expert agent definitions.
#
# This file is the ONE place the shared engineering-ethos text lives. The
# templates (templates/agents/<name>.md.tmpl, templates/commands/<name>.md.tmpl)
# reference these chunks by marker; gen-defs.py at the repo root renders each
# template into its surface (agents/<name>.md or commands/<name>.md).
#
# Marker syntax, usable in templates AND inside chunk bodies:
#
#   @@name@@                        expand chunk "name"
#   @@name variant="platform"@@     expand the named variant of a chunk
#   @@name key="value"@@            expand chunk "name" with @@key@@ bound
#   @@name wrap="70"@@              greedy-wrap the expansion to 70 columns
#
# "variant" and "wrap" are reserved keys. Every other key binds a placeholder
# referenced inside the chunk body; [chunks.X.defaults] supplies the value when
# the marker does not.
#
# Editing any chunk here changes every generated definition that uses it.
# After editing, run: just generate

# ─── Core ethos ──────────────────────────────────────────────────────────────

# Split lead/full so shell-dsl-coder, which continues the sentence with an em
# dash instead of ending it, still shares the opening clause.
[chunks.key-guideline-lead]
text = '''**KEY GUIDELINE**: Code is cost, capability is value'''

[chunks.key-guideline]
text = '''@@key-guideline-lead@@. Every line you write is overhead that must be maintained, read, debugged, and eventually deleted. Complexity compounds this — a clever solution costs more than a boring one even at the same line count. Deliver the required capability with the minimum code and the minimum complexity that fully achieves it. When uncertain whether to add something, default to omission. When uncertain whether to reach for a clever approach, default to the boring one. Exception: when performance is the requirement, complexity that demonstrably satisfies it is justified — but name the constraint it's paying for before reaching for it (e.g., "O(N²) is unacceptable at this scale; this reduces to O(log N)").'''

[chunks.dissent]
text = '''If you believe a directive would produce technically incorrect output, state the concern and your recommended alternative before proceeding — do not silently comply.'''

[chunks.memory-note]
text = '''`memory: user` in the frontmatter is a harness-level directive; the path below is for project-local notes this agent writes'''

# The read-only reviewer guard, shared by the kb reviewers and (via the
# mad-participant-contract chunk) every MAD participant.
[chunks.never-modify-files]
text = '''**You never modify files.** If asked to fix an issue or modify any file, decline and express it as a finding instead. Do not use Edit, Write, or Bash to change file contents.'''

# The full glossed memory footer. agent= must be a literal definition name:
# chunk scope does not inherit a template's @@name@@ binding, so the
# multi-output mad-participant.md.tmpl cannot pass its per-output name here
# and writes the same line shape inline instead.
[chunks.memory-footer]
text = '''**Memory** (@@memory-note@@): `./.claude/agent-memory/@@agent@@/` — record @@record@@.'''

# ─── Testing ─────────────────────────────────────────────────────────────────

# "boundaries" is the language-idiomatic list of boundary kinds; rust-coder
# overrides it with FFI/socket/channel nouns for the same rule.
[chunks.boundary-checks-lead]
defaults.boundaries = '''external API calls, user input parsing, database writes, IPC, and queue boundaries'''
text = '''*Runtime boundary checks*: at significant system boundaries — @@boundaries@@ (any point where data crosses a trust, I/O, or thread boundary) — implement lightweight contract and expectation checks. Apply these only when the change directly touches or creates such a boundary; a fix internal to a module does not require new boundary checks.'''

# Each variant states only its own threshold: an agent needs its own number,
# not a comparison against another agent's.
[chunks.mocking-threshold]
variants.general = '''If you need to mock five dependencies to test one function, fix the design first.'''
variants.platform = '''Avoid mocking more than two dependencies per test; fix the design if you need more — native platform APIs have non-mockable runtime behavior.'''
variants.platform-long = '''If mocking more than two dependencies is required to test one function, fix the design first — native platform APIs have non-mockable runtime behavior, and a design requiring many mocks is usually poorly factored for platform constraints.'''

[chunks.integration-artifact]
text = '''**Integration tests exercise the delivered artifact** through its public surface (the binary/API as shipped), never in-process calls to internals — those are unit/component tests, whatever the file is named. Never create dev-only entry points or test-only verbs to make testing easier; test the real surface, and if the real surface is untestable, that is a design defect to surface, not scaffold around. Dev-only switches (e.g. expensive validation such as heap checking under custom allocators) are a last resort and live behind a config-file setting, never an environment variable.'''

# Born from a recorded kbase failure (2026-08-18: a rejection class named
# with zero preserved instances). Scoped to cited verifications only —
# outcome constraint, not procedure mandate — to avoid checklist paralysis
# on exploratory work. Owns the evidence-location rule (folded from
# integration-artifact's former final sentence). Behavioral-probe
# candidate (ROADMAP item 1): retire if future models pass unprompted.
[chunks.verification-evidence]
text = '''**Verification evidence**: any verification a reported conclusion rests on must be repeatable and inspectable — a test, a runner-recipe invocation, or a preserved command with its captured output; never an ad-hoc sequence whose results live only in the conversation. Results that cannot be re-examined are not results. Where the project defines an evidence location, put it there (integration logs/artifacts included). Exploratory checks along the way are exempt: this binds the verifications you cite, not every look around.'''

# ─── House rules ─────────────────────────────────────────────────────────────

# Sits immediately after each definition's **Build system** paragraph: that text
# governs a project that already has a runner, this one governs the project that
# does not have one yet.
[chunks.new-project-setup]
text = '''**New project setup**: creating a project from scratch means creating its task-runner entry point WITH the first code, never retrofitting it later. A `justfile` by default; a `Makefile` only where the top-level utility commands genuinely need dependency management — file targets with staleness rules, generated content that must rebuild when its sources change, recursive sub-builds (`$(MAKE) -C`). Aliasing commands is never reason enough to choose Make over just. Standard targets: `build`/`rebuild`, `test`, an integration-test target, and `generate`/`regenerate` wherever generation is a distinct step the build does not own — CMake project generation in the C++/CMake family, `go generate` codegen in Go, code/data generation in Python (Rust and Zig typically need none: `build.rs`/`build.zig` own generation). Omit a target only where the task genuinely does not exist for the project — never because wiring it up is effort. No project may ever require the agent or the developer to execute a major project-iteration task from a naked command line with correctly-recalled values: the target is the memory. Also created at project birth: `.claude-temp/`, with a `.claude-temp/` entry in the root `.gitignore` — the project's scratch space (throwaway builds, probe harnesses, captured output), pre-made so the scratch-space rule never stalls on a missing directory. It lives beside `.claude/`, never inside it — writes under `.claude/` trip the permission system's own-settings protections.'''

# Setup-time doctrine relocated out of the global CLAUDE.md (2026-08-29): the
# global file keeps only the ambient precedence rule; project birth carries
# the full structure via the agents that perform it.
[chunks.project-docs-setup]
text = '''**Project documents**: a project with a maintained contract carries, in precedence order: `SPEC.md` — what it must do to be the thing, implementation-independent; `ARCHITECTURE.md` — how this implementation satisfies SPEC.md, citing rather than restating it; `AGENTS.md` — house rules and project-specific traps, not the contract. The code expresses ARCHITECTURE.md and governs nothing; where documents disagree, the higher wins and the lower is the defect. A project CLAUDE.md stays lean — only the project-specific rules that drift when the contract docs fall out of context. A vanilla project may have no CLAUDE.md and no SPEC.md; that is an acceptable state, not a defect. A project intended to be maintained also carries `ROADMAP.md` — next steps and future intent, even if one sentence ("spec implemented; no further work intended"). Future-thinking routes there, never inline in the contract docs; ROADMAP.md sits outside the precedence chain and is not handed to coding dispatches.'''

[chunks.data-formats-scope]
text = '''project-owned configuration and structured data files'''

# The house shell style, single-sourced so generalist-coder and shell-dsl-coder
# cannot prescribe different rules for the same script.
[chunks.shell-house-style]
text = '''`#!/usr/bin/env bash` shebang, 2-space indent. Always brace variables — `${VAR}` not `$VAR`, including inside array indices (`arr[${i}]`) and positional params (`"${1}"`). Use the `function name() {` form, not bare `name() {`. Tests are `[[ ]]` not `[ ]`; string equality is `==` not `=`.'''

[chunks.commercial-approval-clause]
text = '''unless explicitly approved by the coordinator/user'''

[chunks.dependencies-lead]
variants.packages = '''**Dependencies**: every dependency is a permanent maintenance obligation — justify it before adding. No paid or commercial packages @@commercial-approval-clause@@ — report as a Blocker if a task requires a commercial dependency.'''
variants.crates = '''**Dependencies**: every crate is a permanent maintenance obligation and a compile-time and supply-chain cost — justify it before adding. No paid or commercial crates @@commercial-approval-clause@@ — report as a Blocker if a task requires one.'''

# Registry-vetting method (source: CODER_AGENT_EDIT_RECC.md, 2026-08-30): the
# measured check behind dependencies-lead's "justify it". artifact= names where
# the definition surfaces dependency decisions — coder defs justify in the task
# report/Blocker (the default); architect binds a proposal voice. registry= is
# item 2's adoption metric — per-language templates bind only their own; agents
# without one obvious registry keep the multi-registry default. Item 4 owns the
# transitive-deps rule; item 5 extends the lead's commercial rule to
# copyleft/source-available.
[chunks.dependency-vetting]
defaults.artifact = '''justification (task report or Blocker)'''
defaults.registry = '''pkg.go.dev "Imported by", PyPI downloads, crates.io recent downloads, or npm weekly downloads'''
text = '''
**Vet adoption and maintenance from the registry, not the README.** Before adding a dependency, record these in the @@artifact@@ — measured, not asserted:

1. **Last release date** — a stale package is a bus-factor bet no benchmark score offsets.
2. **Adoption count** — @@registry@@ — judged against the niche's scale, not absolute numbers.
3. **Deprecation/archival status** — registries and repo banners show it; READMEs often do not.
4. **Transitive dependency count** — the graph you adopt, not just the package.
5. **License** — compatible with the project's; a copyleft or source-available surprise is a Blocker, same as commercial.

**The port trap:** for a port or binding, verify the PORT's release activity, not its upstream's — a port's README typically describes the upstream project's cadence, which says nothing about whether the port has shipped in years.

**Default to the well-trodden option** unless the off-standard gain is genuinely substantial. Weight the cost of being wrong, not just the benchmark delta: a stale dependency's cost lands later, on whoever replaces it mid-feature.
'''

# Demonstrative deliberately omitted: rust-coder embeds this mid-sentence as
# "that thin abstraction...", everyone else opens with "This thin abstraction...".
[chunks.logging-abstraction-note]
text = '''thin abstraction is an explicit exception to the no-premature-abstraction principle.'''

