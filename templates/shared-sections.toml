# label the general variant used to carry stated nothing the declare-scope
# bullet did not already cover.
[chunks.pe-scope-creep-bullet]
text = '''- **No scope creep**: complete the assigned task and stop. Don't improve adjacent code, add comments to unchanged files, or expand the task boundary.'''

